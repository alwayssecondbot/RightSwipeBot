#    restart: unless-stopped
#    networks:
#      - default
##    network_mode: bridge
#    volumes:
#      - rabbit_v:/data

volumes:
  postgres_v:
  rabbit_v:

networks:
  default:
    driver: bridge
    name: right-swipe-bot