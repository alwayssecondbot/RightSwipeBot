apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    role: WEB
spec:
  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
          hostPort: 80
          protocol: TCP
  restartPolicy: OnFailure
  