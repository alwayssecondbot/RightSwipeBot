apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
  labels:
    role: DB
spec:
  containers:
    - name: postgres
      image: postgres
      imagePullPolicy: IfNotPresent
      ports:
        - name: db
          containerPort: 5432
          hostPort: 5432
          protocol: TCP
      env:
        - name: POSTGRES_PASSWORD
          value: '12345678'
        - name: POSTGRES_USER
          value: 'postgres'
        - name: POSTGRES_DB
          value: 'test-minikube'
  restartPolicy: OnFailure
